models:

  # ============================================================
  # DIMENSION: PRODUCT
  # ============================================================
  - name: dim_product
    description: 
      Product dimension containing one unique record per product.
      Includes product attributes, pricing information, and product classification.
      The Unknown Member uses product_key = -1 for unmatched products.

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "product_key = -1 OR min_price <= max_price"

    columns:
      - name: product_key
        description: "Surrogate key generated from product_id."
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: "Natural key identifying the product."
        data_tests:
          - not_null
          - unique


  # ============================================================
  # DIMENSION: CURRENCY
  # ============================================================
  - name: dim_currency
    description: "Currency dimension containing one record per currency code."

    columns:
      - name: currency_key
        description: "Surrogate key generated from currency_code."
        data_tests:
          - not_null
          - unique

      - name: currency_code
        description: "ISO 4217 currency code."
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3

      - name: currency_name
        description: "Human-readable currency name."
        data_tests:
          - not_null


  # ============================================================
  # FACT: SALES ORDER DETAIL
  # ============================================================
  - name: fact_sales_order_detail
    description: >
      Fact table at order-product grain. Each record represents one unique
      combination of order_id and product_id, with duplicate source records
      aggregated (SUM for order_qty and sales_amount, AVG for unit_price).
      fact_pk is generated from product_id and order_id.

      Partitioned by DATE(order_timestamp) and clustered by
      (currency_key, product_key) to support future scale. The current table
      contains 34,776 rows, so partitioning does not produce a measurable
      reduction in query bytes on the current dataset.

      78 rows have sales_usd_price NULL for two confirmed reasons:
      77 rows belong to 7 currencies without exchange rates
      (ARS, BOB, CRC, DOP, GTQ, PYG, VND), and 1 JPY row
      (product_id 108669) has NULL unit_price in the source.

      Unknown Member usage: customer_key = -1 for 11,643 rows
      (checkout events missing user_id_db); product_key = -1 for 6,985 rows
      (product_id not found in raw.products). No fact rows have
      location_key = -1. However, 14 fact rows resolve to location records
      with NULL or empty geography in dim_location, representing unresolved
      location information retained with a valid location_key.

    columns:

      - name: fact_pk
        description: "Surrogate key generated from product_id and order_id."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Order identifier."
        tests:
          - not_null

      - name: customer_key
        description: >
          Foreign key to dim_customer. -1 represents Unknown Member
          when the source user_id_db cannot be matched to a customer dimension record.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: date_key
        description: "Foreign key to dim_date."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: product_key
        description: >
          Foreign key to dim_product. -1 represents Unknown Member
          for product IDs that do not exist in the product dimension.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: store_key
        description: "Foreign key to dim_store."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key

      - name: currency_key
        description: "Foreign key to dim_currency."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_key

      - name: location_key
        description: >
          Foreign key to dim_location. -1 represents Unknown Member
          when the IP address could not be mapped to a resolved geography.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: ip_address
        description: "Raw IP address associated with the order. Contains PII."
        policy_tags:
          - 'projects/project-cb877e31-7fb6-4cca-856/locations/asia-southeast1/taxonomies/1200166080218566966/policyTags/6523348285393393515'

      - name: order_qty
        description: "Order quantity as provided by the source."

      - name: unit_price
        description: >
          Unit price from the source. NULL is preserved when the source value
          is missing; it is not coerced to zero.

      - name: sales_amount
        description: >
          Sales amount calculated as order_qty * unit_price.

      - name: rate_to_usd
        description: >
          Exchange rate used to convert the transaction currency to USD.
          NULL for currencies without an available exchange rate.

      - name: unit_price_usd
        description: >
          Unit price converted to USD using rate_to_usd.
          NULL when unit_price or rate_to_usd is NULL.

      - name: sales_usd_price
        description: >
          Sales amount converted to USD using rate_to_usd.
          NULL when the exchange rate is unavailable or the source unit_price
          is NULL.


  # ============================================================
  # FACT: EXCHANGE RATE
  # ============================================================
  - name: fact_exchange_rate
    description: "Exchange rate fact containing currency conversion rates."

    columns:
      - name: exchange_rate_key
        description: "Surrogate key identifying an exchange rate record."
        tests:
          - not_null
          - unique

      - name: currency_key
        description: "Foreign key to dim_currency."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_key

      - name: rate_to_usd
        description: >
          Exchange rate from the transaction currency to USD.
          Must be positive when a rate is available.
        tests:
          - not_null


  # ============================================================
  # DIMENSION: STORE
  # ============================================================
  - name: dim_store
    description: >
      Store dimension containing one record per store.

    columns:
      - name: store_key
        description: "Surrogate key identifying a store."
        tests:
          - not_null
          - unique

      - name: store_id
        description: "Business key identifying the store."
        tests:
          - not_null
          - unique


  # ============================================================
  # DIMENSION: LOCATION
  # ============================================================
  - name: dim_location
    description: >
      Location dimension at geography grain.
      Each record represents one unique combination of country,
      region, and city. The Unknown Member represents IP addresses
      whose geographic location could not be resolved.

    config:
      contract:
        enforced: true

    tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list:
              - country_name
              - region_name
              - city_name

    columns:
      - name: location_key
        data_type: INT64
        description: >
          Surrogate key identifying a unique geographic location.
          -1 represents the Unknown Member.
        tests:
          - not_null
          - unique

      - name: country_code
        data_type: STRING
        description: "Country code of the geographic location."

      - name: country_name
        data_type: STRING
        description: "Country name of the geographic location."

      - name: region_name
        data_type: STRING
        description: "Region or state name of the geographic location."

      - name: city_name
        data_type: STRING
        description: "City name of the geographic location."

      - name: inserted_date
        data_type: TIMESTAMP
        description: "Timestamp when the record was inserted by dbt."

      - name: inserted_by
        data_type: STRING
        description: "Process or tool that inserted the record."

      - name: updated_date
        data_type: TIMESTAMP
        description: "Timestamp when the record was last updated by dbt."

      - name: updated_by
        data_type: STRING
        description: "Process or tool that last updated the record."


  # ============================================================
  # DIMENSION: DATE
  # ============================================================
  - name: dim_date
    description: >
      Date dimension containing one record per calendar date.

    columns:
      - name: date_key
        description: "Surrogate key identifying a calendar date."
        tests:
          - not_null
          - unique

      - name: month_number
        description: "Month number from 1 to 12."

      - name: quarter_number
        description: "Quarter number from 1 to 4."

      - name: day_of_week
        description: "Day of week using BigQuery numbering from 1 to 7."


  # ============================================================
  # DIMENSION: CUSTOMER
  # ============================================================
  - name: dim_customer
    description: >
      Customer dimension implementing SCD Type 2.
      Each customer may have multiple historical versions,
      with exactly one current version.
      Current records use 9999-12-31 as the end-date sentinel.

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_date > start_date"

    columns:
      - name: customer_key
        description: "Surrogate key for the customer dimension."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Business key identifying the customer."
        tests:
          - not_null

      - name: email_address
        description: "Customer email address. Contains PII."
        policy_tags:
          - 'projects/project-cb877e31-7fb6-4cca-856/locations/asia-southeast1/taxonomies/1200166080218566966/policyTags/703630202717335588'
  
  - name: bridge_store_domain
    description: >
      Bridge table capturing the many-to-many relationship between
      stores and domains. One row per unique (store, domain) pair.

    columns:
      - name: store_key
        description: "Foreign key to dim_store."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key

      - name: domain
        description: "Domain host extracted from current_url."
        tests:
          - not_null

# ============================================================
# MART: SALES REPORT
# ============================================================
  - name: mart_sales_report
    description: >
      Sales reporting mart combining sales facts with date, product,
      location, store, and currency dimensions.
      Designed for analytical reporting and dashboard consumption.

    columns:
      - name: fact_pk
        description: "Unique surrogate key for the order-product fact record."

      - name: order_id
        description: "Order identifier."

      - name: order_timestamp
        description: "Timestamp when the order event occurred."

      - name: product_id
        description: "Natural key identifying the product."

      - name: product_name
        description: "Product name."

      - name: category_name
        description: "Product category."

      - name: gender
        description: "Product gender classification."

      - name: country_name
        description: "Country associated with the order location."

      - name: city_name
        description: "City associated with the order location."

      - name: store_id
        description: "Business identifier of the store."

      - name: currency_code
        description: "ISO 4217 currency code of the transaction."

      - name: currency_name
        description: "Human-readable currency name."

      - name: order_qty
        description: "Aggregated quantity ordered for the order-product grain."

      - name: unit_price
        description: "Average unit price for the order-product grain."

      - name: sales_amount
        description: "Aggregated sales amount in the original transaction currency."

      - name: rate_to_usd
        description: "Exchange rate used to convert the transaction currency to USD."

      - name: sales_usd_price
        description: "Sales amount converted to USD using the applicable exchange rate."